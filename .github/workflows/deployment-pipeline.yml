name: Build-Test-Release

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_test_failure:
        description: "Run a deliberately failing pytest assertion to verify the release gate"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Generate build version
        id: meta
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Validate and package software
        run: python scripts/build.py --version "1.0.${GITHUB_RUN_NUMBER}" --output dist/build.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/build.zip
          if-no-files-found: error
          retention-days: 14

  test-unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run unit tests with coverage gate
        run: >-
          python -m pytest tests/unit
          --junitxml=reports/unit-${{ matrix.python-version }}.xml
          --cov=app --cov-branch --cov-report=term-missing
          --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml
          --cov-fail-under=90
      - name: Upload unit test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  test-integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      TEST_ENV: staging
      BUILD_ARTIFACT: dist/build.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run integration tests
        run: python -m pytest tests/integration --junitxml=reports/integration-${{ matrix.python-version }}.xml
      - name: Demonstrate a failing pytest assertion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_test_failure }}
        run: python -m pytest tests/demo --junitxml=reports/failure-demo-${{ matrix.python-version }}.xml
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  deploy-dev:
    name: Release to Dev
    needs: [build, test-unit, test-integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Create Dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: dev-v${{ needs.build.outputs.version }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: gh release create "$TAG" dist/build.zip --title "$TAG" --notes "$NOTE"

  deploy-staging:
    name: Release to Staging
    needs: [build, test-unit, test-integration, deploy-dev]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Create Staging release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: staging-v${{ needs.build.outputs.version }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: gh release create "$TAG" dist/build.zip --title "$TAG" --notes "$NOTE"

  test-production:
    name: Production smoke tests
    needs: [build, test-unit, test-integration, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TEST_ENV: prod
      BUILD_ARTIFACT: dist/build.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Download staged build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run production smoke tests
        run: python -m pytest tests/smoke --junitxml=reports/production-smoke.xml
      - name: Upload production smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  deploy-production:
    name: Release to Production
    needs: [build, test-unit, test-integration, test-production, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist
      - name: Create Production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: prod-v${{ needs.build.outputs.version }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: gh release create "$TAG" dist/build.zip --title "$TAG" --notes "$NOTE"

